# Research max mode (docs/design.md §11): every lane on, scheduler decides.
mode: exact
verifier: block

target:
  model: "tiny:1234"
  device: cpu
  record_hidden: true   # required by the MTP lane

lanes:
  ngram: {}
  mtp:
    num_offsets: 3
    # checkpoint: checkpoints/mtp_heads.pt
  diffusion:
    canvas_length: 32
    max_denoise_steps: 8
    reconcile: reconcile
  compressed_kv:
    bits: 4

scheduler:
  type: contextual_bandit   # docs/design.md §11: objective accepted_tokens/sec
  draft_len: 4
  canvas_len: 32
  min_lane_acceptance: 0.30
  mtp_acceptance_gate: 0.65
  # 24.4 constraints: exact_greedy is structural (always on); these bound
  # memory and rejection so the bandit can't keep a runaway lane.
  memory_penalty: 0.05
  max_gpu_kv_gb: 20
  max_rejection_rate: 0.35
  # Entropy gate (docs/design.md §10): shorten drafts once predictive entropy runs high
  # (high entropy -> early rejection likely -> long blocks waste work).
  entropy_gate_threshold: 3.0
  entropy_gate_factor: 0.5
