[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dart-serving"
version = "0.3.0"
description = "DART: verified drafting and reproducible local model evaluation"
readme = {text = "DART provides verified drafting and local model evaluation. The Supra-50M presets use float32 with SDPA on CPU and eager attention on CUDA. Use dart check to compare complete outputs with HF before benchmarking. Supply model files locally.", content-type = "text/plain"}
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.1",
    "transformers>=4.40",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "safetensors>=0.4",
]

[project.urls]
Repository = "https://github.com/tugrapaydiner/dart"

[project.scripts]
dart = "dart.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-timeout", "ruff>=0.4"]
figures = ["matplotlib>=3.8", "fonttools>=4.47"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["dart*", "benchmarks*"]

[tool.setuptools.package-data]
dart = ["py.typed"]
benchmarks = ["fixtures/v0.3-prompts.jsonl", "fixtures/v0.3-sources.json"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = [
    "E731",  # lambda assignment: used deliberately for tiny local closures
    "E501",  # long lines: mostly docstrings/tables where a hard wrap hurts
    "B905",  # zip(strict=): several zips are intentionally unequal-length
]

[tool.ruff.lint.isort]
known-first-party = ["dart", "benchmarks", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]  # repo root on sys.path so `pytest` resolves dart/benchmarks/tests imports
